# Hetzner CX23 production deployment
# Usage:
#   cp .env.prod.example .env.prod   # fill in real values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# First-time SSL setup — run BEFORE bringing up nginx with HTTPS:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod run --rm certbot \
#     certonly --webroot --webroot-path /var/www/certbot \
#     -d api.YOUR_DOMAIN --email YOUR_EMAIL --agree-tos --no-eff-email
# Then reload nginx:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod exec nginx nginx -s reload

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend
    expose:
      - "8000"

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    command: celery -A celery_app worker --loglevel=info --concurrency=2
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/streetsense.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - backend

  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Runs renewal check every 12 hours; exits cleanly when not yet due
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  pgdata:
  redisdata:

networks:
  backend:
    driver: bridge
