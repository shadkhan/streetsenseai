# Nginx reverse proxy for StreetSense AI API on Hetzner CX23
# Replace api.YOUR_DOMAIN with your actual domain (e.g. api.streetsenseai.com)

# HTTP → HTTPS redirect + Let's Encrypt webroot challenge
server {
    listen 80;
    server_name api.YOUR_DOMAIN;

    # Certbot webroot challenge — must be reachable over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS API
server {
    listen 443 ssl;
    server_name api.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/api.YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;

    # Increase buffer for streaming responses (AI copilot SSE)
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Upload limit for webhook payloads
    client_max_body_size 2m;

    location / {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Keep-alive for streaming
        proxy_set_header   Connection        "";
    }
}
